<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="./MHlogo.png">
    <title>HSC Result Login MSBSHSEB</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="header">
            <div class="logo">
                <img src="MHlogo.png" alt="">
            </div>
            <div class="title">
                MAHARASHTRA STATE BOARD OF SECONDARY & HIGHER SECONDARY EDUCATION, PUNE
            </div>
        </div>
    </header>

    <main>
        <div class="main">
            <div class="title2">
                <span class="subtitle">
                    SSC EXAMINATION RESULT FEBRUARY 2026
                </span>
            </div>

            <!-- ✅ FIXED FORM -->
            <form id="resultForm">
                <input type="text" placeholder="Seat Number" id="seat" required>
                <input type="text" placeholder="Mother First Name" id="mname" required>

                <div class="Notebox">
                    Enter XXX, if mother's name is not mentioned in application form
                </div>

                <button id="viewresult" type="submit">View Result</button>

                <p>Note: An asterisk (*) indicates a required field</p>
            </form>

        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
